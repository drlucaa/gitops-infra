apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zitadel-config
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/apps/zitadel-config/apollo
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: zitadel
