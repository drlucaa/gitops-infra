apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-config
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/infra/external-secrets/cluster-stores/apollo
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: external-secrets
  decryption:
    provider: sops
    secretRef:
      name: sops-age
