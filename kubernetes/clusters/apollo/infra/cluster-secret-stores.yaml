apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-secret-stores
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/infra/cluster-secret-stores/apollo
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: external-secrets
