apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secret-test
  namespace: zitadel
spec:
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: secret-test
  data:
    - secretKey: username
      remoteRef:
        key: "test-secret"
        property: "username"
    - secretKey: password
      remoteRef:
        key: "test-secret"
        property: "password"
